name: Quality

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./...
      - name: Queue benchmark
        run: go test ./internal/jobs -run='^$' -bench=. -benchmem
      - name: Workflow lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Source security analysis
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...
      - name: Secret scan (history and working tree)
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner
      - name: Dependency and deployment scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: go-decluttarr:verify
          platforms: linux/amd64
      - name: Smoke test
        run: docker run --rm go-decluttarr:verify --version
      - name: Runtime image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: go-decluttarr:verify
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
